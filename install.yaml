name: ddev-ai-workspace

ddev_version_constraint: '>= v1.24.10'

dependencies:
  - trebormc/ddev-ai-ssh
  - trebormc/ddev-playwright-mcp
  - trebormc/ddev-beads
  - trebormc/ddev-agents-sync
  - trebormc/ddev-opencode
  - trebormc/ddev-claude-code
  - trebormc/ddev-ralph

pre_install_actions:
  - |
    #ddev-description:Installing DDEV AI Workspace
    echo "Installing ddev-ai-workspace — all AI development tools for DDEV."

project_files: []

global_files: []

post_install_actions:
  - |
    #ddev-description:Updating child add-ons
    # DDEV's own `dependencies:` handling only installs MISSING add-ons; this
    # step refreshes every child to its latest GitHub release so that one
    # `ddev add-on get trebormc/ddev-ai-workspace` updates the whole set.
    # Set DDEV_AI_WORKSPACE_SKIP_DEPS=1 to skip it, e.g. when the children were
    # just installed from local checkouts (no GitHub traffic, exact versions).
    if [ "${DDEV_AI_WORKSPACE_SKIP_DEPS:-}" = "1" ]; then
      echo "Skipping child add-on refresh (DDEV_AI_WORKSPACE_SKIP_DEPS=1)."
    else
      echo "Updating all child add-ons to latest version..."
      ddev add-on get trebormc/ddev-ai-ssh
      ddev add-on get trebormc/ddev-playwright-mcp
      ddev add-on get trebormc/ddev-beads
      ddev add-on get trebormc/ddev-agents-sync
      ddev add-on get trebormc/ddev-opencode
      ddev add-on get trebormc/ddev-claude-code
      ddev add-on get trebormc/ddev-ralph
    fi
  - |
    #ddev-description:Pulling latest Docker images
    docker pull ${PLAYWRIGHT_MCP_IMAGE:-mcr.microsoft.com/playwright/mcp:latest}
  - |
    #ddev-description:Installation complete
    echo ""
    echo "=== DDEV AI Workspace installed/updated ==="
    echo ""
    echo "All add-ons updated:"
    echo "  - ddev-ai-ssh (SSH access to web)"
    echo "  - ddev-playwright-mcp (headless browser)"
    echo "  - ddev-beads (task tracking)"
    echo "  - ddev-agents-sync (agent configs)"
    echo "  - ddev-opencode (OpenCode CLI)"
    echo "  - ddev-claude-code (Claude Code CLI)"
    echo "  - ddev-ralph (autonomous orchestrator)"
    echo ""
    echo "Next steps:"
    echo "  1. Run: ddev restart"
    echo "  2. Run: ddev opencode   or   ddev claude-code"
    echo "     (each tool guides you through authentication on first launch)"
    echo "  3. Optional: parallel candidates in isolated worktrees with ai-arena,"
    echo "     a host package run from a coordinator project above this one:"
    echo "     https://github.com/trebormc/ddev-ai-arena"
    echo ""
    echo "Optional: Desktop notifications (install once on host):"
    echo "  curl -fsSL https://raw.githubusercontent.com/trebormc/ai-notify-bridge/main/install.sh | bash"
    echo ""

removal_actions:
  - |
    #ddev-description:Cleaning up AI Workspace
    echo "AI Workspace meta add-on removed."
    echo "Note: Individual add-ons are still installed."
    echo "Remove them individually with: ddev add-on remove <name>"
